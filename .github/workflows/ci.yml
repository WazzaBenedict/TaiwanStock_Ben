name: CI
on:
  push:
    branches: [main, "claude/**"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - name: Import app
        run: python -c "import app; print(len(app.app.routes), 'routes')"
      - name: Tests
        run: python -m pytest -q tests/
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Frontend JS syntax
        run: |
          for f in public/js/*.js; do node --check "$f"; done
      - name: Version numbers agree
        run: python scripts/check_version.py
