name: Deploy frontend
# 合併到 main 後自動把 public/ 發布到 Firebase Hosting。
# 需要 repo secret FIREBASE_SERVICE_ACCOUNT（Firebase 服務帳戶金鑰 JSON）；沒設定時會跳過並提示。
on:
  push:
    branches: [main]
    paths: ["public/**", "firebase.json", ".firebaserc", ".github/workflows/deploy-hosting.yml"]
  workflow_dispatch:
concurrency:
  group: deploy-hosting
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Version numbers agree
        run: python scripts/check_version.py
      - name: Skip notice
        if: env.HAS_KEY != 'true'
        run: echo "::warning::FIREBASE_SERVICE_ACCOUNT 尚未設定，略過發布。"
      - name: Deploy to Firebase Hosting (live)
        if: env.HAS_KEY == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: taiwanstock-ben
          channelId: live
