name: Deploy frontend
# 發布 public/ 到 Firebase Hosting，並在發布前產生「今日」快照 public/data/today.json 與每日報告存檔 public/data/reports.json。
# 觸發：合併到 main、手動、以及交易日盤前／收盤／晚上（台北時間）多個時段定時更新快照。
# 需要 repo secret FIREBASE_SERVICE_ACCOUNT；選用 FINMIND_TOKEN（提高夜盤資料額度）。
# 注意：GitHub 的定時工作可能延遲數分鐘；repo 60 天沒有任何活動時，定時工作會被自動停用。
on:
  push:
    branches: [main]
    paths: ["public/**", "pipeline/**", "cloudstore.py", "firebase.json", ".firebaserc", ".github/workflows/deploy-hosting.yml"]
  schedule:
    # GitHub 定時工作整點常延後好幾小時，改用冷門分鐘並多排幾個時段；每次都會自動補算缺的報告與候選
    - cron: "17 21 * * 0-4"   # 05:17 台北（盤前，美股已收）
    - cron: "41 22 * * 0-4"   # 06:41 台北（盤前）
    - cron: "37 5 * * 1-5"    # 13:37 台北（收盤）
    - cron: "37 6 * * 1-5"    # 14:37 台北（收盤，補跑）
    - cron: "13 11 * * 1-5"   # 19:13 台北（收盤價定稿）
  workflow_dispatch:
concurrency:
  group: deploy-hosting
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Version numbers agree
        run: python scripts/check_version.py
      - name: Build today snapshot
        id: snapshot
        continue-on-error: true
        run: |
          pip install -q httpx==0.27.0 PyJWT==2.8.0 cryptography==42.0.8
          python -m pipeline.snapshot public/data/today.json
      - name: Keep the previous snapshot if today's failed
        if: steps.snapshot.outcome != 'success'
        run: |
          echo "::warning::今日快照產生失敗，沿用線上舊檔。"
          mkdir -p public/data
          curl -fsS -m 30 https://taiwanstock-ben.web.app/data/today.json -o public/data/today.json || rm -f public/data/today.json
          # 檔案不存在時網站會回首頁 HTML（200），要確認真的是 JSON 才保留
          python -c 'import json,sys; json.load(open(sys.argv[1]))' public/data/today.json 2>/dev/null || rm -f public/data/today.json
      - name: Build daily report archive
        id: report
        continue-on-error: true
        timeout-minutes: 12
        run: python -m pipeline.report public/data/today.json public/data/reports.json
      - name: Keep the previous reports if today's failed
        if: steps.report.outcome != 'success'
        run: |
          echo "::warning::每日報告存檔失敗，沿用線上舊檔。"
          mkdir -p public/data
          curl -fsS -m 30 https://taiwanstock-ben.web.app/data/reports.json -o public/data/reports.json || rm -f public/data/reports.json
          # 檔案不存在時網站會回首頁 HTML（200），要確認真的是 JSON 才保留
          python -c 'import json,sys; json.load(open(sys.argv[1]))' public/data/reports.json 2>/dev/null || rm -f public/data/reports.json
      - name: Build research scorecard
        id: research
        continue-on-error: true
        run: python -m pipeline.research public/data/research.json
      - name: Keep the previous scorecard if today's failed
        if: steps.research.outcome != 'success'
        run: |
          echo "::warning::研究室評分表產生失敗，沿用線上舊檔。"
          mkdir -p public/data
          curl -fsS -m 30 https://taiwanstock-ben.web.app/data/research.json -o public/data/research.json || rm -f public/data/research.json
          # 檔案不存在時網站會回首頁 HTML（200），要確認真的是 JSON 才保留
          python -c 'import json,sys; json.load(open(sys.argv[1]))' public/data/research.json 2>/dev/null || rm -f public/data/research.json
      - name: Skip notice
        if: env.HAS_KEY != 'true'
        run: echo "::warning::FIREBASE_SERVICE_ACCOUNT 尚未設定，略過發布。"
      - name: Deploy to Firebase Hosting (live)
        if: env.HAS_KEY == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: taiwanstock-ben
          channelId: live
